<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b2b">
  <title>完成證明驗證｜媒體素養三小時自學課程</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/verify.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>
  <header class="site-header">
    <a class="brand" href="/">媒體素養三小時自學課程</a>
    <nav><a href="/">回到課程</a></nav>
  </header>
  <main id="main" class="verify-main">
    <section class="page-heading">
      <p class="eyebrow">公開查驗</p>
      <h1>本站課程完成證明驗證</h1>
      <p>輸入完成證明右下角的編號。公開結果不顯示 Email、分數、實作證據或教案內容。</p>
    </section>
    <section class="panel narrow">
      <form id="verify-form" class="stack-form">
        <label for="certificate-code">完成證明編號</label>
        <input id="certificate-code" name="code" autocomplete="off" placeholder="MLC-2026-⋯" required>
        <button class="button primary" type="submit">驗證完成證明</button>
      </form>
      <div id="verify-result" aria-live="polite"></div>
    </section>
  </main>
  <footer class="site-footer"><p>媒體素養三小時自學課程</p></footer>
</body>
</html>
